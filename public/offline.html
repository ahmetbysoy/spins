<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Spins — Bağlantı Yok</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0B0E14; color: #f1f5f9; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace;
    padding: 24px; text-align: center;
  }
  .logo { font-size: 44px; letter-spacing: 8px; color: #22d3ee; font-weight: 800; margin-bottom: 18px; }
  h1 { font-size: 17px; margin-bottom: 8px; }
  p { font-size: 13px; color: #94a3b8; line-height: 1.6; max-width: 320px; margin-bottom: 28px; }
  button {
    background: rgba(34, 211, 238, 0.12); color: #22d3ee;
    border: 1px solid rgba(34, 211, 238, 0.4); border-radius: 10px;
    padding: 12px 28px; font: inherit; font-size: 14px; font-weight: 700;
    min-height: 48px; cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: scale(0.97); }
  .hint { margin-top: 20px; font-size: 11px; color: #475569; }
</style>
</head>
<body>
  <div class="logo">SPINS</div>
  <h1>Canlı terminale ulaşılamıyor</h1>
  <p>İnternet bağlantını ya da ağ erişimini kontrol et. Terminal açıldığında veri akışı otomatik başlar.</p>
  <button onclick="location.replace('https://ahmetbysoy-spins.vercel.app')">Tekrar Dene</button>
  <div class="hint" id="hint">10 saniye içinde otomatik yeniden denenecek…</div>
  <script>
    var left = 10;
    var t = setInterval(function () {
      left--;
      var el = document.getElementById('hint');
      if (left <= 0) { clearInterval(t); el.textContent = 'Yeniden deneniyor…'; location.replace('https://ahmetbysoy-spins.vercel.app'); }
      else { el.textContent = left + ' saniye içinde otomatik yeniden denenecek…'; }
    }, 1000);
  </script>
</body>
</html>
