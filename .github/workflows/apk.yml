name: APK

# Otomatik Android APK — Capacitor kabuğu (com.ahmetbysoy.spins) canlı siteyi açar.
# - workflow_dispatch: Actions sekmesinden elle tetiklenir (debug APK her zaman üretilir)
# - v* etiketi: push etiketi atınca Release APK (+ release imza sırları varsa imzalı) ve GitHub Release yayımlanır
# Release imzalaması (opsiyonel, güncellenebilir kurulum için önerilir):
#   keytool -genkey -v -keystore spins.keystore -alias spins -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 spins.keystore  →  repo secrets: RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# ayni anda tek APK build — eski run iptal edilir
concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK build
    runs-on: ubuntu-latest
    env:
      # secrets baglami step if'te kullanilamaz — env'e tasinir
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK (her zaman — kurulum için hazır)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Decode release keystore (sır varsa)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/spins.keystore

      - name: Build release APK (imzalı)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          RELEASE_STORE_FILE: spins.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spins-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: GitHub Release (yalnızca v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/**/*.apk
